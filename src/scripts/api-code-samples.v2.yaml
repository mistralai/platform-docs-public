version: 1
patches:
  - path: /paths/~1v1~1chat~1completions/post/x-codeSamples
    value:
      - lang: typescript
        label: TypeScript
        source: |
          import { Mistral } from "@mistralai/mistralai";

          const client = new Mistral({ apiKey: process.env.MISTRAL_API_KEY });

          const response = await client.chat.complete({
            model: "mistral-large-latest",
            messages: [
              {
                role: "user",
                content: "Who is the best French painter? Answer in one short sentence.",
              },
            ],
          });

          console.log(response.choices[0].message.content);
      - lang: python
        label: Python
        source: |
          from mistralai.client import Mistral
          import os

          with Mistral(
              api_key=os.getenv("MISTRAL_API_KEY", ""),
          ) as mistral:
              response = mistral.chat.complete(
                  model="mistral-large-latest",
                  messages=[
                      {
                          "role": "user",
                          "content": "Who is the best French painter? Answer in one short sentence.",
                      }
                  ],
              )

              print(response.choices[0].message.content)
      - lang: curl
        label: cURL
        source: |
          curl https://api.mistral.ai/v1/chat/completions \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $MISTRAL_API_KEY" \
            -d '{
              "model": "mistral-large-latest",
              "messages": [
                {
                  "role": "user",
                  "content": "Who is the best French painter? Answer in one short sentence."
                }
              ]
            }'
    source: user
    note: 'DOC-434: override generated Chat Completion samples so cURL includes role; SDK v2-only override kept because Speakeasy placeholders are less useful than the curated example'
  - path: /paths/~1v1~1ocr/post/x-codeSamples
    value:
      - lang: typescript
        label: TypeScript
        source: |
          import { Mistral } from "@mistralai/mistralai";

          const client = new Mistral({ apiKey: process.env.MISTRAL_API_KEY });

          const ocrResponse = await client.ocr.process({
            model: "mistral-ocr-latest",
            document: {
              type: "document_url",
              documentUrl: "https://arxiv.org/pdf/2201.04234",
            },
          });

          console.log(ocrResponse.pages[0].markdown);
      - lang: python
        label: Python
        source: |
          from mistralai.client import Mistral
          import os

          with Mistral(
              api_key=os.getenv("MISTRAL_API_KEY", ""),
          ) as mistral:
              ocr_response = mistral.ocr.process(
                  model="mistral-ocr-latest",
                  document={
                      "type": "document_url",
                      "document_url": "https://arxiv.org/pdf/2201.04234",
                  },
              )

              print(ocr_response.pages[0].markdown)
      - lang: curl
        label: cURL
        source: |
          curl https://api.mistral.ai/v1/ocr \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $MISTRAL_API_KEY" \
            -d '{
              "model": "mistral-ocr-latest",
              "document": {
                "type": "document_url",
                "document_url": "https://arxiv.org/pdf/2201.04234"
              }
            }'
    note: migrated from api-docs-overrides.yaml (ocr_v1_ocr_post); SDK v2-only override kept because Speakeasy placeholders are less useful than the curated example
    source: user
