<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="345" viewBox="0 0 1100 345" role="img" aria-label="One turn on a timeline, from left to right. The user speaks, pauses briefly, speaks again, then falls silent. Turn detection marks five moments: start when the speech begins; eager end during the short pause, because the turn is probably over; resume when the user speaks again, which cancels the eager end; a second eager end in the final silence; then end, which confirms the turn is over. A reply started on the first eager end is dropped at the resume. A reply started on the second eager end is ready sooner when the end arrives. Not drawn to scale.">
  <defs>
    <style>
      .node { stroke-width: 1.5; }
      .node--card { fill: #f5f4f2; stroke: #d6d2cd; }
      .node--accent { fill: #d35a20; stroke: #b84d1a; }

      .label {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 18px;
        font-weight: 600;
        fill: #302e2b;
      }
      .label--accent { fill: #fff; }

      .sublabel {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 15px;
        font-style: italic;
        fill: #7a7a7a;
      }
      .sublabel--accent { fill: rgba(255,255,255,0.82); }

      .caption {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 17px;
        font-style: italic;
        fill: #7a7a7a;
      }

      .marker {
        stroke: #b0aaa4;
        stroke-width: 1.5;
        stroke-dasharray: 5 4;
        fill: none;
      }

      .bracket {
        stroke: #b0aaa4;
        stroke-width: 1.5;
        fill: none;
      }

      .arrow {
        stroke: #b0aaa4;
        stroke-width: 2.5;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .arrowHead { fill: #b0aaa4; }

      @media (prefers-color-scheme: dark) {
        .node--card { fill: #2d2d2d; stroke: #444; }
        .node--accent { fill: #d35a20; stroke: #e0631f; }
        .label { fill: #f0f0f0; }
        .label--accent { fill: #fff; }
        .sublabel { fill: #999; }
        .sublabel--accent { fill: rgba(255,255,255,0.82); }
        .caption { fill: #999; }
        .marker { stroke: #666; }
        .bracket { stroke: #666; }
        .arrow { stroke: #666; }
        .arrowHead { fill: #666; }
      }
    </style>

    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" class="arrowHead"/>
    </marker>
  </defs>

  <!-- Layout: speech lane y=40..100 (center 70, label 76). Speech 1 x=120..460, pause 460..600, speech 2 x=600..790, silence 790..1070 -->
  <!-- Time axis y=120, x 40 to 1080. Event x: start 120, eager end 490, resume 600, eager end 830, end 1000 -->
  <!-- Event boxes 150x56: row A y=150 (start, resume, end), row B y=226 (both eager ends). Label top+24, sublabel top+46 -->
  <!-- Markers from y=40 to the top of each event box. Brackets y=300 (ticks from 292), captions y=324. Not to scale -->

  <!-- ===== Event markers (drawn first, behind the lane) ===== -->
  <path class="marker" d="M 120 40 L 120 150"/>
  <path class="marker" d="M 490 40 L 490 226"/>
  <path class="marker" d="M 600 40 L 600 150"/>
  <path class="marker" d="M 830 40 L 830 226"/>
  <path class="marker" d="M 1000 40 L 1000 150"/>

  <!-- ===== Speech lane ===== -->
  <rect class="node node--card" x="120" y="40" width="340" height="60" rx="12"/>
  <text class="label" x="290" y="76" text-anchor="middle">User speaks</text>

  <text class="sublabel" x="545" y="76" text-anchor="middle">Pause</text>

  <rect class="node node--card" x="600" y="40" width="190" height="60" rx="12"/>
  <text class="label" x="695" y="76" text-anchor="middle">Speaks again</text>

  <text class="sublabel" x="915" y="76" text-anchor="middle">Silence</text>

  <!-- ===== Time axis ===== -->
  <path class="arrow" d="M 40 120 L 1080 120" marker-end="url(#ah)"/>

  <!-- ===== Row A: start, resume, end (one accent: end) ===== -->
  <rect class="node node--card" x="45" y="150" width="150" height="56" rx="10"/>
  <text class="label" x="120" y="174" text-anchor="middle">Start</text>
  <text class="sublabel" x="120" y="196" text-anchor="middle">speech begins</text>

  <rect class="node node--card" x="525" y="150" width="150" height="56" rx="10"/>
  <text class="label" x="600" y="174" text-anchor="middle">Resume</text>
  <text class="sublabel" x="600" y="196" text-anchor="middle">user goes on</text>

  <rect class="node node--accent" x="925" y="150" width="150" height="56" rx="10"/>
  <text class="label label--accent" x="1000" y="174" text-anchor="middle">End</text>
  <text class="sublabel sublabel--accent" x="1000" y="196" text-anchor="middle">turn confirmed</text>

  <!-- ===== Row B: eager ends ===== -->
  <rect class="node node--card" x="415" y="226" width="150" height="56" rx="10"/>
  <text class="label" x="490" y="250" text-anchor="middle">Eager end</text>
  <text class="sublabel" x="490" y="272" text-anchor="middle">probably over</text>

  <rect class="node node--card" x="755" y="226" width="150" height="56" rx="10"/>
  <text class="label" x="830" y="250" text-anchor="middle">Eager end</text>
  <text class="sublabel" x="830" y="272" text-anchor="middle">probably over</text>

  <!-- ===== What the application does with the eager ends ===== -->
  <path class="bracket" d="M 490 292 L 490 300 L 600 300 L 600 292"/>
  <text class="caption" x="545" y="324" text-anchor="middle">Reply started, then dropped</text>

  <path class="bracket" d="M 830 292 L 830 300 L 1000 300 L 1000 292"/>
  <text class="caption" x="915" y="324" text-anchor="middle">Reply ready sooner</text>
</svg>
