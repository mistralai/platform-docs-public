<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640" role="img" aria-label="Lifecycle of a realtime transcription session, between your application on the left and the Mistral API on the right, in four stages. Open: your application connects with the model and its API key, and the API answers with session.created. Configure: your application sends session.update with its settings, and the API answers with session.updated. Stream, repeated while audio flows: your application sends input_audio.append with each audio chunk, and the API sends transcription.text.delta with each piece of new text. Finish: your application sends input_audio.end, and the API answers with transcription.done, which carries the full transcript.">
  <defs>
    <style>
      .node { stroke-width: 1.5; }
      .node--card { fill: #f5f4f2; stroke: #d6d2cd; }
      .node--accent { fill: #d35a20; stroke: #b84d1a; }
      .container { fill: #fafaf8; stroke: #d6d2cd; stroke-width: 1.5; stroke-dasharray: 6 4; }

      .label {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 20px;
        font-weight: 600;
        fill: #302e2b;
      }
      .label--message { font-size: 18px; }
      .label--accent { fill: #fff; }

      .card-label {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 16px;
        font-weight: 700;
        letter-spacing: 0.3px;
        fill: #302e2b;
      }

      .sublabel {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 15px;
        font-style: italic;
        fill: #7a7a7a;
      }

      .lifeline {
        stroke: #d6d2cd;
        stroke-width: 1.5;
        stroke-dasharray: 5 5;
        fill: none;
      }

      .arrow {
        stroke: #b0aaa4;
        stroke-width: 2.5;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .arrowHead { fill: #b0aaa4; }

      @media (prefers-color-scheme: dark) {
        .node--card { fill: #2d2d2d; stroke: #444; }
        .node--accent { fill: #d35a20; stroke: #e0631f; }
        .container { fill: #232323; stroke: #444; }
        .label { fill: #f0f0f0; }
        .label--accent { fill: #fff; }
        .card-label { fill: #f0f0f0; }
        .sublabel { fill: #999; }
        .lifeline { stroke: #444; }
        .arrow { stroke: #666; }
        .arrowHead { fill: #666; }
      }
    </style>

    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" class="arrowHead"/>
    </marker>
  </defs>

  <!-- Layout: sequence diagram, two lifelines. Headers 260x60 at y=20: application x=170 (center 300), API x=770 (center 900) -->
  <!-- Lifelines x=300 and x=900, from y=80 to y=620. Messages at y 140, 200, 260, 320, 410, 460, 530, 590; labels at y-12, centered x=600 -->
  <!-- Stage names left-aligned at x=30, between their two messages: 176, 296, 441, 566 -->
  <!-- Stream loop: dashed container x=250..950, y=350..482, title at (316, 374), between the lifelines -->

  <!-- ===== Participants ===== -->
  <rect class="node node--card" x="170" y="20" width="260" height="60" rx="14"/>
  <text class="label" x="300" y="57" text-anchor="middle">Your application</text>

  <rect class="node node--accent" x="770" y="20" width="260" height="60" rx="14"/>
  <text class="label label--accent" x="900" y="57" text-anchor="middle">Mistral API</text>

  <!-- ===== Stream loop (drawn first, behind lifelines and arrows) ===== -->
  <rect class="container" x="250" y="350" width="700" height="132" rx="12"/>
  <text class="sublabel" x="316" y="374">Repeated while audio flows</text>

  <!-- ===== Lifelines ===== -->
  <path class="lifeline" d="M 300 80 L 300 620"/>
  <path class="lifeline" d="M 900 80 L 900 620"/>

  <!-- ===== Stage names ===== -->
  <text class="card-label" x="30" y="176">Open</text>
  <text class="card-label" x="30" y="296">Configure</text>
  <text class="card-label" x="30" y="441">Stream</text>
  <text class="card-label" x="30" y="566">Finish</text>

  <!-- ===== Open ===== -->
  <path class="arrow" d="M 300 140 L 898 140" marker-end="url(#ah)"/>
  <text class="label label--message" x="600" y="128" text-anchor="middle">Connect with the model and your API key</text>

  <path class="arrow" d="M 900 200 L 302 200" marker-end="url(#ah)"/>
  <text class="label label--message" x="600" y="188" text-anchor="middle">session.created</text>

  <!-- ===== Configure ===== -->
  <path class="arrow" d="M 300 260 L 898 260" marker-end="url(#ah)"/>
  <text class="label label--message" x="600" y="248" text-anchor="middle">session.update</text>

  <path class="arrow" d="M 900 320 L 302 320" marker-end="url(#ah)"/>
  <text class="label label--message" x="600" y="308" text-anchor="middle">session.updated</text>

  <!-- ===== Stream ===== -->
  <path class="arrow" d="M 300 410 L 898 410" marker-end="url(#ah)"/>
  <text class="label label--message" x="600" y="398" text-anchor="middle">input_audio.append</text>

  <path class="arrow" d="M 900 460 L 302 460" marker-end="url(#ah)"/>
  <text class="label label--message" x="600" y="448" text-anchor="middle">transcription.text.delta</text>

  <!-- ===== Finish ===== -->
  <path class="arrow" d="M 300 530 L 898 530" marker-end="url(#ah)"/>
  <text class="label label--message" x="600" y="518" text-anchor="middle">input_audio.end</text>

  <path class="arrow" d="M 900 590 L 302 590" marker-end="url(#ah)"/>
  <text class="label label--message" x="600" y="578" text-anchor="middle">transcription.done</text>
</svg>
