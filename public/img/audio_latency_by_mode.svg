<svg xmlns="http://www.w3.org/2000/svg" width="1170" height="675" viewBox="0 0 1170 675" role="img" aria-label="What the user waits for in each audio mode. Offline request: send the input, the model processes all of it, then the complete result arrives; the wait is the time to the complete result. Realtime transcription: a word is spoken, the streaming delay and the network follow, then its text arrives; the wait is the time to first transcript. Speech generation: send the text, the first chunk is generated, the player buffers it, then the first sound plays; the wait is the time to first audio. Voice agent turn: the user stops speaking, end-of-turn detection runs, then the model and its tools, then speech, then the first sound plays; the wait is the per-turn latency. End-of-turn detection is highlighted. Boxes are not drawn to scale.">
  <defs>
    <style>
      .node { stroke-width: 1.5; }
      .node--card { fill: #f5f4f2; stroke: #d6d2cd; }
      .node--inner { fill: #ffffff; stroke: #d6d2cd; }
      .node--accent { fill: #d35a20; stroke: #b84d1a; }

      .card-label {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 20px;
        font-weight: 700;
        letter-spacing: 0.3px;
        fill: #302e2b;
      }

      .label {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 20px;
        font-weight: 600;
        fill: #302e2b;
      }
      .label--accent { fill: #fff; }

      .caption {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 18px;
        font-style: italic;
        fill: #7a7a7a;
      }

      .bracket {
        stroke: #b0aaa4;
        stroke-width: 1.5;
        fill: none;
      }

      .arrow {
        stroke: #b0aaa4;
        stroke-width: 2.5;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .arrowHead { fill: #b0aaa4; }

      @media (prefers-color-scheme: dark) {
        .node--card { fill: #2d2d2d; stroke: #444; }
        .node--inner { fill: #1f1f1f; stroke: #444; }
        .node--accent { fill: #d35a20; stroke: #e0631f; }
        .card-label { fill: #f0f0f0; }
        .label { fill: #f0f0f0; }
        .label--accent { fill: #fff; }
        .caption { fill: #999; }
        .bracket { stroke: #666; }
        .arrow { stroke: #666; }
        .arrowHead { fill: #666; }
      }
    </style>

    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" class="arrowHead"/>
    </marker>
  </defs>

  <!-- Layout: 4 rows, one per mode. Boxes 190x60, 40px arrow gaps, not to scale -->
  <!-- Box x: 30, 260, 490, 720, 950 — centers: 125, 355, 585, 815, 1045 -->
  <!-- Row top T: 20, 185, 350, 515. Title T+22; boxes T+36 (center T+66, label T+73); bracket T+110 (ticks from T+102); caption T+132 -->
  <!-- White boxes: what the user does or perceives. Grey boxes: stages in between. One accent: end-of-turn detection -->

  <!-- ===== Row 1: offline request (T=20) ===== -->
  <text class="card-label" x="30" y="42">Offline request</text>
  <rect class="node node--inner" x="30" y="56" width="190" height="60" rx="12"/>
  <text class="label" x="125" y="93" text-anchor="middle">Send input</text>
  <path class="arrow" d="M 220 86 L 260 86" marker-end="url(#ah)"/>
  <rect class="node node--card" x="260" y="56" width="190" height="60" rx="12"/>
  <text class="label" x="355" y="93" text-anchor="middle">Process all of it</text>
  <path class="arrow" d="M 450 86 L 490 86" marker-end="url(#ah)"/>
  <rect class="node node--inner" x="490" y="56" width="190" height="60" rx="12"/>
  <text class="label" x="585" y="93" text-anchor="middle">Complete result</text>
  <path class="bracket" d="M 30 122 L 30 130 L 680 130 L 680 122"/>
  <text class="caption" x="355" y="152" text-anchor="middle">Time to the complete result</text>

  <!-- ===== Row 2: realtime transcription (T=185) ===== -->
  <text class="card-label" x="30" y="207">Realtime transcription</text>
  <rect class="node node--inner" x="30" y="221" width="190" height="60" rx="12"/>
  <text class="label" x="125" y="258" text-anchor="middle">Word spoken</text>
  <path class="arrow" d="M 220 251 L 260 251" marker-end="url(#ah)"/>
  <rect class="node node--card" x="260" y="221" width="190" height="60" rx="12"/>
  <text class="label" x="355" y="258" text-anchor="middle">Streaming delay</text>
  <path class="arrow" d="M 450 251 L 490 251" marker-end="url(#ah)"/>
  <rect class="node node--card" x="490" y="221" width="190" height="60" rx="12"/>
  <text class="label" x="585" y="258" text-anchor="middle">Network</text>
  <path class="arrow" d="M 680 251 L 720 251" marker-end="url(#ah)"/>
  <rect class="node node--inner" x="720" y="221" width="190" height="60" rx="12"/>
  <text class="label" x="815" y="258" text-anchor="middle">Text arrives</text>
  <path class="bracket" d="M 30 287 L 30 295 L 910 295 L 910 287"/>
  <text class="caption" x="470" y="317" text-anchor="middle">Time to first transcript</text>

  <!-- ===== Row 3: speech generation (T=350) ===== -->
  <text class="card-label" x="30" y="372">Speech generation</text>
  <rect class="node node--inner" x="30" y="386" width="190" height="60" rx="12"/>
  <text class="label" x="125" y="423" text-anchor="middle">Send text</text>
  <path class="arrow" d="M 220 416 L 260 416" marker-end="url(#ah)"/>
  <rect class="node node--card" x="260" y="386" width="190" height="60" rx="12"/>
  <text class="label" x="355" y="423" text-anchor="middle">First chunk</text>
  <path class="arrow" d="M 450 416 L 490 416" marker-end="url(#ah)"/>
  <rect class="node node--card" x="490" y="386" width="190" height="60" rx="12"/>
  <text class="label" x="585" y="423" text-anchor="middle">Player buffer</text>
  <path class="arrow" d="M 680 416 L 720 416" marker-end="url(#ah)"/>
  <rect class="node node--inner" x="720" y="386" width="190" height="60" rx="12"/>
  <text class="label" x="815" y="423" text-anchor="middle">First sound</text>
  <path class="bracket" d="M 30 452 L 30 460 L 910 460 L 910 452"/>
  <text class="caption" x="470" y="482" text-anchor="middle">Time to first audio</text>

  <!-- ===== Row 4: voice agent turn (T=515) ===== -->
  <text class="card-label" x="30" y="537">Voice agent turn</text>
  <rect class="node node--inner" x="30" y="551" width="190" height="60" rx="12"/>
  <text class="label" x="125" y="588" text-anchor="middle">User stops</text>
  <path class="arrow" d="M 220 581 L 260 581" marker-end="url(#ah)"/>
  <rect class="node node--accent" x="260" y="551" width="190" height="60" rx="12"/>
  <text class="label label--accent" x="355" y="588" text-anchor="middle">End of turn</text>
  <path class="arrow" d="M 450 581 L 490 581" marker-end="url(#ah)"/>
  <rect class="node node--card" x="490" y="551" width="190" height="60" rx="12"/>
  <text class="label" x="585" y="588" text-anchor="middle">Model and tools</text>
  <path class="arrow" d="M 680 581 L 720 581" marker-end="url(#ah)"/>
  <rect class="node node--card" x="720" y="551" width="190" height="60" rx="12"/>
  <text class="label" x="815" y="588" text-anchor="middle">Speech</text>
  <path class="arrow" d="M 910 581 L 950 581" marker-end="url(#ah)"/>
  <rect class="node node--inner" x="950" y="551" width="190" height="60" rx="12"/>
  <text class="label" x="1045" y="588" text-anchor="middle">First sound</text>
  <path class="bracket" d="M 30 617 L 30 625 L 1140 625 L 1140 617"/>
  <text class="caption" x="585" y="647" text-anchor="middle">Per-turn latency</text>
</svg>
