<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="130" viewBox="0 0 1140 130" role="img" aria-label="An inbound phone call, from left to right: the caller dials your number; your SIP system, such as a carrier, a PBX, or a contact center platform, forwards the call over SIP; the Mistral SIP endpoint finds the agent bound to that number; your saved agent answers the caller.">
  <defs>
    <style>
      .node { stroke-width: 1.5; }
      .node--card { fill: #f5f4f2; stroke: #d6d2cd; }
      .node--accent { fill: #d35a20; stroke: #b84d1a; }

      .label {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 20px;
        font-weight: 600;
        fill: #302e2b;
      }
      .label--accent { fill: #fff; }

      .sublabel {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 15px;
        font-style: italic;
        fill: #7a7a7a;
      }
      .sublabel--accent { fill: rgba(255,255,255,0.82); }

      .arrow {
        stroke: #b0aaa4;
        stroke-width: 2.5;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .arrowHead { fill: #b0aaa4; }

      @media (prefers-color-scheme: dark) {
        .node--card { fill: #2d2d2d; stroke: #444; }
        .node--accent { fill: #d35a20; stroke: #e0631f; }
        .label { fill: #f0f0f0; }
        .label--accent { fill: #fff; }
        .sublabel { fill: #999; }
        .sublabel--accent { fill: rgba(255,255,255,0.82); }
        .arrow { stroke: #666; }
        .arrowHead { fill: #666; }
      }
    </style>

    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" class="arrowHead"/>
    </marker>
  </defs>

  <!-- Layout: 4 nodes, 240x90, 50px gaps, y=20 -->
  <!-- x: 20, 310, 600, 890 — centers: 140, 430, 720, 1010 — center-y: 65; label y=61, sublabel y=86 -->

  <!-- ===== 1. Caller ===== -->
  <rect class="node node--card" x="20" y="20" width="240" height="90" rx="14"/>
  <text class="label" x="140" y="61" text-anchor="middle">Caller</text>
  <text class="sublabel" x="140" y="86" text-anchor="middle">dials your number</text>

  <path class="arrow" d="M 260 65 L 308 65" marker-end="url(#ah)"/>

  <!-- ===== 2. Your SIP system ===== -->
  <rect class="node node--card" x="310" y="20" width="240" height="90" rx="14"/>
  <text class="label" x="430" y="61" text-anchor="middle">Your SIP system</text>
  <text class="sublabel" x="430" y="86" text-anchor="middle">carrier, PBX, or contact center</text>

  <path class="arrow" d="M 550 65 L 598 65" marker-end="url(#ah)"/>

  <!-- ===== 3. Mistral SIP endpoint ===== -->
  <rect class="node node--card" x="600" y="20" width="240" height="90" rx="14"/>
  <text class="label" x="720" y="61" text-anchor="middle">Mistral SIP endpoint</text>
  <text class="sublabel" x="720" y="86" text-anchor="middle">finds the agent for the number</text>

  <path class="arrow" d="M 840 65 L 888 65" marker-end="url(#ah)"/>

  <!-- ===== 4. Your saved agent (accent) ===== -->
  <rect class="node node--accent" x="890" y="20" width="240" height="90" rx="14"/>
  <text class="label label--accent" x="1010" y="61" text-anchor="middle">Your saved agent</text>
  <text class="sublabel sublabel--accent" x="1010" y="86" text-anchor="middle">answers the caller</text>
</svg>
