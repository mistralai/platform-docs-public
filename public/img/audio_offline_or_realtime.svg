<svg xmlns="http://www.w3.org/2000/svg" width="940" height="640" viewBox="0 0 940 640" role="img" aria-label="Choosing an audio mode. First question: is the input complete before you send it? If yes, use offline: one request and one complete result, and stream the response if you need it sooner. If no, second question: does your app answer back by voice? If yes, use voice agents, which chain realtime transcription, a model, and speech. If no, use realtime: a session that returns results as the audio arrives.">
  <defs>
    <style>
      .node { stroke-width: 1.5; }
      .node--card { fill: #f5f4f2; stroke: #d6d2cd; }
      .node--accent { fill: #d35a20; stroke: #b84d1a; }

      .label {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 24px;
        font-weight: 600;
        fill: #302e2b;
      }
      .label--question { font-size: 21px; }
      .label--accent { fill: #fff; }

      .sublabel {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 18px;
        fill: #7a7a7a;
      }

      .branch {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 16px;
        font-weight: 600;
        fill: #7a7a7a;
      }

      .caption {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 16px;
        font-style: italic;
        fill: #7a7a7a;
      }

      .arrow {
        stroke: #b0aaa4;
        stroke-width: 2.5;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .arrowHead { fill: #b0aaa4; }

      @media (prefers-color-scheme: dark) {
        .node--card { fill: #2d2d2d; stroke: #444; }
        .node--accent { fill: #d35a20; stroke: #e0631f; }
        .label { fill: #f0f0f0; }
        .label--accent { fill: #fff; }
        .sublabel { fill: #999; }
        .branch { fill: #999; }
        .caption { fill: #999; }
        .arrow { stroke: #666; }
        .arrowHead { fill: #666; }
      }
    </style>

    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" class="arrowHead"/>
    </marker>
  </defs>

  <!-- Layout: flowchart, decisions as diamonds (Yes exits right, No exits down), outcomes as rounded boxes -->
  <!-- Diamonds 440x180 (half 220x90): Q1 center (240,120), Q2 center (240,370) -->
  <!-- Outcome boxes 380x90: Offline (540,75) center-y 120; Voice agents (540,325) center-y 370; Realtime (50,530) center (240,575) -->
  <!-- Two-line questions: baselines at center-6 and center+22; boxes: label at center-4, sublabel at center+21 -->

  <!-- ===== Question 1 (key decision) ===== -->
  <polygon class="node node--accent" points="240,30 460,120 240,210 20,120"/>
  <text class="label label--question label--accent" x="240" y="114" text-anchor="middle">Is the input complete</text>
  <text class="label label--question label--accent" x="240" y="142" text-anchor="middle">before you send it?</text>

  <!-- ===== Q1 yes: offline ===== -->
  <path class="arrow" d="M 460 120 L 540 120" marker-end="url(#ah)"/>
  <text class="branch" x="500" y="108" text-anchor="middle">Yes</text>

  <rect class="node node--card" x="540" y="75" width="380" height="90" rx="14"/>
  <text class="label" x="730" y="116" text-anchor="middle">Offline</text>
  <text class="sublabel" x="730" y="141" text-anchor="middle">One request, one complete result</text>
  <text class="caption" x="730" y="196" text-anchor="middle">Need it sooner? Stream the response.</text>

  <!-- ===== Q1 no: question 2 ===== -->
  <path class="arrow" d="M 240 210 L 240 280" marker-end="url(#ah)"/>
  <text class="branch" x="254" y="251">No</text>

  <polygon class="node node--card" points="240,280 460,370 240,460 20,370"/>
  <text class="label label--question" x="240" y="364" text-anchor="middle">Does your app answer</text>
  <text class="label label--question" x="240" y="392" text-anchor="middle">back by voice?</text>

  <!-- ===== Q2 yes: voice agents ===== -->
  <path class="arrow" d="M 460 370 L 540 370" marker-end="url(#ah)"/>
  <text class="branch" x="500" y="358" text-anchor="middle">Yes</text>

  <rect class="node node--card" x="540" y="325" width="380" height="90" rx="14"/>
  <text class="label" x="730" y="366" text-anchor="middle">Voice agents</text>
  <text class="sublabel" x="730" y="391" text-anchor="middle">Realtime transcription, model, speech</text>

  <!-- ===== Q2 no: realtime ===== -->
  <path class="arrow" d="M 240 460 L 240 530" marker-end="url(#ah)"/>
  <text class="branch" x="254" y="501">No</text>

  <rect class="node node--card" x="50" y="530" width="380" height="90" rx="14"/>
  <text class="label" x="240" y="571" text-anchor="middle">Realtime</text>
  <text class="sublabel" x="240" y="596" text-anchor="middle">A session, results as the audio arrives</text>
</svg>
