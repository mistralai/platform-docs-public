<svg xmlns="http://www.w3.org/2000/svg" width="1190" height="520" viewBox="0 0 1190 520" role="img" aria-label="The pipeline of one voice agent turn, in two lanes. Your application, in Python, Node.js, or a browser page, holds the microphone, your client-side tools, and the speaker. Mistral runs transcription, the model, server-side tools, and speech, with the models and the voice taken from the agent's configuration. The user's speech goes from the microphone to transcription, then to the model, then to speech, and back to the speaker in your application. The model calls client-side tools in your application and server-side tools at Mistral, and gets their results back.">
  <defs>
    <style>
      .node { stroke-width: 1.5; }
      .node--card { fill: #f5f4f2; stroke: #d6d2cd; }
      .node--optional { stroke-dasharray: 6 4; }
      .container { fill: #fafaf8; stroke: #d6d2cd; stroke-width: 1.5; stroke-dasharray: 6 4; }

      .title {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 22px;
        font-weight: 700;
        fill: #302e2b;
      }

      .label {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 20px;
        font-weight: 600;
        fill: #302e2b;
      }

      .sublabel {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 16px;
        font-style: italic;
        fill: #7a7a7a;
      }

      .caption {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 16px;
        font-style: italic;
        fill: #7a7a7a;
      }

      .arrow {
        stroke: #b0aaa4;
        stroke-width: 2.5;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .arrowHead { fill: #b0aaa4; }

      @media (prefers-color-scheme: dark) {
        .node--card { fill: #2d2d2d; stroke: #444; }
        .container { fill: #232323; stroke: #444; }
        .title { fill: #f0f0f0; }
        .label { fill: #f0f0f0; }
        .sublabel { fill: #999; }
        .caption { fill: #999; }
        .arrow { stroke: #666; }
        .arrowHead { fill: #666; }
      }
    </style>

    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" class="arrowHead"/>
    </marker>
  </defs>

  <!-- Layout: two lanes (dashed containers) 1150 wide at x=20; app lane y 20-170, Mistral lane y 230-500 -->
  <!-- Boxes 190x80, rx 12, 5 columns at x 40, 270, 500, 730, 960 (40px gaps) — centers 135, 365, 595, 825, 1055 -->
  <!-- App row y=70 (center 110); Mistral row y=280 (center 320); server tools row y=400 (center 440) -->
  <!-- Labels at top+33, sublabels at top+58. Tool arrows: call at x=575, result at x=615 -->

  <!-- ===== Lane: your application ===== -->
  <rect class="container" x="20" y="20" width="1150" height="150" rx="16"/>
  <text class="title" x="40" y="52">Your application</text>
  <text class="caption" x="1150" y="52" text-anchor="end">Python, Node.js, or a browser page</text>

  <!-- ===== Lane: Mistral ===== -->
  <rect class="container" x="20" y="230" width="1150" height="270" rx="16"/>
  <text class="title" x="40" y="262">Mistral</text>
  <text class="caption" x="1150" y="262" text-anchor="end">Models and voice from the agent's configuration</text>

  <!-- ===== 1. Microphone ===== -->
  <rect class="node node--card" x="40" y="70" width="190" height="80" rx="12"/>
  <text class="label" x="135" y="103" text-anchor="middle">Microphone</text>
  <text class="sublabel" x="135" y="128" text-anchor="middle">the user speaks</text>

  <!-- ===== 2. Transcription ===== -->
  <rect class="node node--card" x="270" y="280" width="190" height="80" rx="12"/>
  <text class="label" x="365" y="313" text-anchor="middle">Transcription</text>
  <text class="sublabel" x="365" y="338" text-anchor="middle">and end of turn</text>

  <!-- ===== 3. Model ===== -->
  <rect class="node node--card" x="500" y="280" width="190" height="80" rx="12"/>
  <text class="label" x="595" y="313" text-anchor="middle">Model</text>
  <text class="sublabel" x="595" y="338" text-anchor="middle">writes the answer</text>

  <!-- ===== 4. Speech ===== -->
  <rect class="node node--card" x="730" y="280" width="190" height="80" rx="12"/>
  <text class="label" x="825" y="313" text-anchor="middle">Speech</text>
  <text class="sublabel" x="825" y="338" text-anchor="middle">in the agent's voice</text>

  <!-- ===== 5. Speaker ===== -->
  <rect class="node node--card" x="960" y="70" width="190" height="80" rx="12"/>
  <text class="label" x="1055" y="103" text-anchor="middle">Speaker</text>
  <text class="sublabel" x="1055" y="128" text-anchor="middle">the user hears it</text>

  <!-- ===== Client-side tools (when called) ===== -->
  <rect class="node node--card node--optional" x="500" y="70" width="190" height="80" rx="12"/>
  <text class="label" x="595" y="103" text-anchor="middle">Client tools</text>
  <text class="sublabel" x="595" y="128" text-anchor="middle">your functions</text>

  <!-- ===== Server-side tools (when called) ===== -->
  <rect class="node node--card node--optional" x="500" y="400" width="190" height="80" rx="12"/>
  <text class="label" x="595" y="433" text-anchor="middle">Server tools</text>
  <text class="sublabel" x="595" y="458" text-anchor="middle">built-in, connectors</text>

  <!-- ===== Arrows: main flow ===== -->
  <!-- Microphone down to Transcription -->
  <path class="arrow" d="M 135 150 L 135 320 L 270 320" marker-end="url(#ah)"/>
  <!-- Transcription to Model -->
  <path class="arrow" d="M 460 320 L 500 320" marker-end="url(#ah)"/>
  <!-- Model to Speech -->
  <path class="arrow" d="M 690 320 L 730 320" marker-end="url(#ah)"/>
  <!-- Speech up to Speaker -->
  <path class="arrow" d="M 920 320 L 1055 320 L 1055 150" marker-end="url(#ah)"/>

  <!-- ===== Arrows: tool calls and results ===== -->
  <!-- Model calls a client tool, result comes back -->
  <path class="arrow" d="M 575 280 L 575 150" marker-end="url(#ah)"/>
  <path class="arrow" d="M 615 150 L 615 280" marker-end="url(#ah)"/>
  <!-- Model calls a server tool, result comes back -->
  <path class="arrow" d="M 575 360 L 575 400" marker-end="url(#ah)"/>
  <path class="arrow" d="M 615 400 L 615 360" marker-end="url(#ah)"/>
</svg>
