<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="400" viewBox="0 0 1100 400" role="img" aria-label="Turn detection as three states. The session starts in Waiting, with no turn in progress. When the speech score rises above start_threshold, turn.start moves it to User speaking. When the score falls below eager_end_threshold, turn.eager_end moves it to Probably finished. From there, if the score rises above start_threshold again, turn.resume moves it back to User speaking. If the score is below end_threshold after a pause of at least min_silence_ms, or once a pause reaches end_timeout_ms, turn.end moves it back to Waiting, and the next turn.start opens a new turn.">
  <defs>
    <style>
      .node { stroke-width: 1.5; }
      .node--card { fill: #f5f4f2; stroke: #d6d2cd; }
      .node--accent { fill: #d35a20; stroke: #b84d1a; }

      .label {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 20px;
        font-weight: 600;
        fill: #302e2b;
      }
      .label--event { font-size: 18px; }
      .label--accent { fill: #fff; }

      .sublabel {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 15px;
        font-style: italic;
        fill: #7a7a7a;
      }
      .sublabel--accent { fill: rgba(255,255,255,0.82); }

      .arrow {
        stroke: #b0aaa4;
        stroke-width: 2.5;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .arrowHead { fill: #b0aaa4; }

      @media (prefers-color-scheme: dark) {
        .node--card { fill: #2d2d2d; stroke: #444; }
        .node--accent { fill: #d35a20; stroke: #e0631f; }
        .label { fill: #f0f0f0; }
        .label--accent { fill: #fff; }
        .sublabel { fill: #999; }
        .sublabel--accent { fill: rgba(255,255,255,0.82); }
        .arrow { stroke: #666; }
        .arrowHead { fill: #666; }
      }
    </style>

    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" class="arrowHead"/>
    </marker>
  </defs>

  <!-- Layout: 3 states 220x90 at y=110, x 30, 440, 850 (190px gaps) — centers 140, 550, 960, center-y 155 -->
  <!-- State label at y=151, sublabel at y=176. One accent: User speaking -->
  <!-- Transitions: start A->B y=170 (labels above in the gap, center x 345); eager end B->C y=135 (labels above, center x 755); -->
  <!-- resume C->B y=180 (labels below, center x 755); end C->A along y=300 under the states (labels below, center x 550) -->

  <!-- ===== States ===== -->
  <rect class="node node--card" x="30" y="110" width="220" height="90" rx="14"/>
  <text class="label" x="140" y="151" text-anchor="middle">Waiting</text>
  <text class="sublabel" x="140" y="176" text-anchor="middle">no turn in progress</text>

  <rect class="node node--accent" x="440" y="110" width="220" height="90" rx="14"/>
  <text class="label label--accent" x="550" y="151" text-anchor="middle">User speaking</text>
  <text class="sublabel sublabel--accent" x="550" y="176" text-anchor="middle">turn in progress</text>

  <rect class="node node--card" x="850" y="110" width="220" height="90" rx="14"/>
  <text class="label" x="960" y="151" text-anchor="middle">Probably finished</text>
  <text class="sublabel" x="960" y="176" text-anchor="middle">the turn may end</text>

  <!-- ===== turn.start: Waiting -> User speaking ===== -->
  <path class="arrow" d="M 250 170 L 440 170" marker-end="url(#ah)"/>
  <text class="label label--event" x="345" y="112" text-anchor="middle">turn.start</text>
  <text class="sublabel" x="345" y="134" text-anchor="middle">score rises above</text>
  <text class="sublabel" x="345" y="154" text-anchor="middle">start_threshold</text>

  <!-- ===== turn.eager_end: User speaking -> Probably finished ===== -->
  <path class="arrow" d="M 660 135 L 850 135" marker-end="url(#ah)"/>
  <text class="label label--event" x="755" y="78" text-anchor="middle">turn.eager_end</text>
  <text class="sublabel" x="755" y="100" text-anchor="middle">score falls below</text>
  <text class="sublabel" x="755" y="120" text-anchor="middle">eager_end_threshold</text>

  <!-- ===== turn.resume: Probably finished -> User speaking ===== -->
  <path class="arrow" d="M 850 180 L 660 180" marker-end="url(#ah)"/>
  <text class="label label--event" x="755" y="210" text-anchor="middle">turn.resume</text>
  <text class="sublabel" x="755" y="232" text-anchor="middle">score rises above</text>
  <text class="sublabel" x="755" y="252" text-anchor="middle">start_threshold</text>

  <!-- ===== turn.end: Probably finished -> Waiting ===== -->
  <path class="arrow" d="M 960 200 L 960 300 L 140 300 L 140 200" marker-end="url(#ah)"/>
  <text class="label label--event" x="550" y="332" text-anchor="middle">turn.end</text>
  <text class="sublabel" x="550" y="356" text-anchor="middle">score below end_threshold after a pause of min_silence_ms,</text>
  <text class="sublabel" x="550" y="378" text-anchor="middle">or a pause that reaches end_timeout_ms</text>
</svg>
