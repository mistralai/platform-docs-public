<svg xmlns="http://www.w3.org/2000/svg" width="1170" height="305" viewBox="0 0 1170 305" role="img" aria-label="One voice agent turn. From the moment the user stops speaking, the stages run in order: end-of-turn detection, transcript, model, tools when the model calls one, then speech, until the user hears the answer. When a tool call starts, a filler plays above the tools stage until the result is back. Two waits are marked below: the first sound, which arrives when the filler starts, and the useful answer, which arrives at the end of the chain. Boxes are not drawn to scale.">
  <defs>
    <style>
      .node { stroke-width: 1.5; }
      .node--card { fill: #f5f4f2; stroke: #d6d2cd; }
      .node--optional { stroke-dasharray: 6 4; }
      .node--accent { fill: #d35a20; stroke: #b84d1a; }

      .label {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 20px;
        font-weight: 600;
        fill: #302e2b;
      }
      .label--marker { font-size: 18px; }
      .label--accent { fill: #fff; }

      .sublabel {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 16px;
        font-style: italic;
        fill: #7a7a7a;
      }

      .caption {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 18px;
        font-style: italic;
        fill: #7a7a7a;
      }

      .marker {
        stroke: #7a7a7a;
        stroke-width: 2;
        fill: none;
      }

      .bracket {
        stroke: #b0aaa4;
        stroke-width: 1.5;
        fill: none;
      }

      .arrow {
        stroke: #b0aaa4;
        stroke-width: 2.5;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .arrowHead { fill: #b0aaa4; }

      @media (prefers-color-scheme: dark) {
        .node--card { fill: #2d2d2d; stroke: #444; }
        .node--accent { fill: #d35a20; stroke: #e0631f; }
        .label { fill: #f0f0f0; }
        .label--accent { fill: #fff; }
        .sublabel { fill: #999; }
        .caption { fill: #999; }
        .marker { stroke: #999; }
        .bracket { stroke: #666; }
        .arrow { stroke: #666; }
        .arrowHead { fill: #666; }
      }
    </style>

    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" class="arrowHead"/>
    </marker>
  </defs>

  <!-- Layout: start marker x=40, 5 stage boxes 170x70 at x 80, 290, 500, 710, 920 (40px arrow gaps), end marker x=1130 -->
  <!-- Stage centers: 165, 375, 585, 795, 1005 — boxes y=100, center-y 135, label 142 (Tools: label 131, sublabel 156) -->
  <!-- Filler band 170x50 above Tools: (710,30). Markers from y=74 to y=262 -->
  <!-- Brackets: first sound y=210 (40 to 710), useful answer y=262 (40 to 1130); captions 24px below. Not to scale -->

  <!-- ===== Start and end markers ===== -->
  <text class="label label--marker" x="30" y="62">User stops speaking</text>
  <path class="marker" d="M 40 74 L 40 262"/>
  <text class="label label--marker" x="1140" y="62" text-anchor="end">User hears the answer</text>
  <path class="marker" d="M 1130 74 L 1130 262"/>

  <!-- ===== Filler (one accent) ===== -->
  <rect class="node node--accent" x="710" y="30" width="170" height="50" rx="10"/>
  <text class="label label--marker label--accent" x="795" y="61" text-anchor="middle">Filler plays</text>

  <!-- ===== Stages ===== -->
  <path class="arrow" d="M 40 135 L 80 135" marker-end="url(#ah)"/>
  <rect class="node node--card" x="80" y="100" width="170" height="70" rx="12"/>
  <text class="label" x="165" y="142" text-anchor="middle">End of turn</text>

  <path class="arrow" d="M 250 135 L 290 135" marker-end="url(#ah)"/>
  <rect class="node node--card" x="290" y="100" width="170" height="70" rx="12"/>
  <text class="label" x="375" y="142" text-anchor="middle">Transcript</text>

  <path class="arrow" d="M 460 135 L 500 135" marker-end="url(#ah)"/>
  <rect class="node node--card" x="500" y="100" width="170" height="70" rx="12"/>
  <text class="label" x="585" y="142" text-anchor="middle">Model</text>

  <path class="arrow" d="M 670 135 L 710 135" marker-end="url(#ah)"/>
  <rect class="node node--card node--optional" x="710" y="100" width="170" height="70" rx="12"/>
  <text class="label" x="795" y="131" text-anchor="middle">Tools</text>
  <text class="sublabel" x="795" y="156" text-anchor="middle">when called</text>

  <path class="arrow" d="M 880 135 L 920 135" marker-end="url(#ah)"/>
  <rect class="node node--card" x="920" y="100" width="170" height="70" rx="12"/>
  <text class="label" x="1005" y="142" text-anchor="middle">Speech</text>

  <path class="arrow" d="M 1090 135 L 1130 135" marker-end="url(#ah)"/>

  <!-- ===== What the user waits for ===== -->
  <path class="bracket" d="M 40 202 L 40 210 L 710 210 L 710 202"/>
  <text class="caption" x="375" y="234" text-anchor="middle">First sound, when a filler plays</text>

  <path class="bracket" d="M 40 254 L 40 262 L 1130 262 L 1130 254"/>
  <text class="caption" x="585" y="286" text-anchor="middle">Useful answer</text>
</svg>
